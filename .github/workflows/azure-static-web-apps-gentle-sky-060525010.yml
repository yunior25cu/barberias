name: Azure Static Web Apps CI/CD

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: alcorte-swa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality-gates:
    uses: ./.github/workflows/ci-cd.yml

  build_and_deploy_job:
    needs: quality-gates
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Build and deploy Next.js Hybrid
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GENTLE_SKY_060525010 }}
          action: upload
          app_location: "/"
          api_location: ""
          output_location: ""
          app_build_command: "npm run build"
