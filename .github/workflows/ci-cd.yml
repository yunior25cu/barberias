name: Al Corte Quality Gates

on:
  push:
    branches: [barber, integration/multi-tenant]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server@sha256:4525e3efac9f3e241cb003bb2ff2a82818b502f37e12049d788b1a9fa7e13b7f
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: AlCorte-CI-Sql-2026!
        ports:
          - 1433:1433
        # The SQL client probe in the workflow verifies engine readiness.
        options: >-
          --health-cmd "exit 0"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 10s
    env:
      DATABASE_URL: sqlserver://localhost:1433;database=barber_local;user=sa;password=AlCorte-CI-Sql-2026!;encrypt=true;trustServerCertificate=true
      MSSQL_SA_PASSWORD: AlCorte-CI-Sql-2026!
      SESSION_SECRET: 0123456789abcdef0123456789abcdef-ci-only
      ADMIN_USERNAME: ci-owner
      ADMIN_PASSWORD: Ci-only-password-2026!
      APP_URL: http://127.0.0.1:3000
      SEED_DEMO_DATA: "false"
      RUN_DB_TESTS: "1"
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Guard CI database target
        run: node scripts/assert-ci-database.mjs
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Security audit
        run: npm audit --audit-level=moderate
      - name: Wait for SQL Server
        run: node scripts/wait-for-sqlserver.mjs
      - name: Create isolated test database
        run: node scripts/create-local-sqlserver-db.mjs
      - name: Inspect before migrating
        run: npm run db:inspect
      - name: Apply reviewed legacy SQL Server baseline
        env:
          ALCORTE_MIGRATION_TARGET: 20261117010000_init_sqlserver
        run: npm run db:release
      - name: Seed synthetic populated legacy schema
        run: node scripts/seed-legacy-multitenant-fixture.mjs
      - name: Apply incremental tenant migration
        run: npm run db:release
      - name: Verify Prisma migration history
        run: npx prisma migrate status
      - name: Verify preserved data and tenant constraints
        run: node scripts/verify-multitenant-migration.mjs
      - name: Provision disposable test administrator
        run: npm run db:seed
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and real SQL Server concurrency tests
        run: npm test
      - name: Install Playwright Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: HTTP and functional E2E tests
        run: npm run test:e2e
      - name: Production build
        run: npm run build
